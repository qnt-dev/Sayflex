[workspace]
members = [
    "apps/pet_host",
    "crates/pet_core",
    "crates/pet_face",
    "crates/pet_hands",
    "crates/pet_ipc",
    "crates/pet_motion",
    "crates/pet_orb",
    "crates/pet_particles",
    "crates/pet_platform",
    "crates/pet_render",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
