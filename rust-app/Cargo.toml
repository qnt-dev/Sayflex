[workspace]
members = [
    "apps/companion-renderer",
    "apps/desktop",
    "apps/input-host",
    "apps/speech-worker",
    "apps/translation-worker",
    "crates/app-core",
    "crates/cloud-speech",
    "crates/model-manager",
    "crates/platform-windows",
    "crates/protocol",
    "crates/speech-api",
    "crates/translation-engine",
]
resolver = "3"

[workspace.package]
version = "0.5.27"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
# `renderer-software` is not for shipping — the winit backend still picks
# the GPU renderer. It exists so a build can be told SLINT_BACKEND=
# winit-software and render on the CPU, which is the only way to read the
# window back as pixels on a machine whose composited surface the screen
# capture APIs return blank for. Seeing the interface is part of building it.
slint = { version = "1.17.1", features = ["unstable-winit-030", "renderer-software"] }
slint-build = "1.17.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
unicode-segmentation = "1.13.3"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
windows = { version = "0.62.2", features = [
    "Win32_System_Com",
    "Win32_UI_Accessibility",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
