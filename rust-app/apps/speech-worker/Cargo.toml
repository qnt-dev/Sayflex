[package]
name = "sayflex-speech-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
cuda = ["whisper-rs/cuda"]

[dependencies]
anyhow = "1.0.100"
cpal = "0.18.1"
hound = "3.5.1"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
rtrb = "0.3.4"
rust-app-core = { version = "0.5.12", path = "../../crates/app-core" }
rust-model-manager = { version = "0.5.12", path = "../../crates/model-manager" }
rust-platform-windows = { version = "0.5.12", path = "../../crates/platform-windows" }
rust-protocol = { version = "0.5.12", path = "../../crates/protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
whisper-rs = { version = "0.16.0" }

[dev-dependencies]
tempfile.workspace = true
