<!--
  A transparent red sound mark. At Windows tray sizes even a thin dark outline
  consumes the red interior and reads as a black stripe, so the waveform is
  deliberately solid accent with no tile or outline.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <g>
    <rect x="29" y="97" width="22" height="62" rx="11" fill="#ef5048" />
    <rect x="73" y="72" width="22" height="112" rx="11" fill="#ef5048" />
    <rect x="117" y="49" width="22" height="158" rx="11" fill="#ef5048" />
    <rect x="161" y="72" width="22" height="112" rx="11" fill="#ef5048" />
    <rect x="205" y="97" width="22" height="62" rx="11" fill="#ef5048" />
  </g>
</svg>
