[package]
name = "sayflex-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
pet_orb = { version = "0.1.0", path = "../../../desktop-pet/crates/pet_orb" }
pet_particles = { version = "0.1.0", path = "../../../desktop-pet/crates/pet_particles" }
pet_render = { version = "0.1.0", path = "../../../desktop-pet/crates/pet_render" }
rust-app-core = { version = "0.8.0", path = "../../crates/app-core" }
rust-model-manager = { version = "0.8.0", path = "../../crates/model-manager" }
rust-platform-windows = { version = "0.8.0", path = "../../crates/platform-windows" }
rust-protocol = { version = "0.8.0", path = "../../crates/protocol" }
qrcode = { version = "0.14.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
slint.workspace = true
unicode-segmentation.workspace = true

[build-dependencies]
slint-build.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.23"

[dev-dependencies]
i-slint-backend-testing = "1.17.1"
rqrr = { version = "0.11.0", default-features = false }
tempfile.workspace = true

[features]
# Compiles Slint's CPU renderer in as well, so a build can be told
# SLINT_BACKEND=winit-software and have its window read back as pixels. That is
# the only way to see this interface on a machine whose composited surface the
# screen-capture APIs return blank for. Off by default: a shipped binary has no
# use for a second renderer.
inspect = ["slint/renderer-software"]
