<!--
  The mark, in the material the settings window is drawn in: graphite ink, one
  warm accent, nothing else. The five bars are the trace the recording overlay
  draws; the square at the corner is the same dot the brand mark in the footer
  carries, and it is the only place the accent appears — which is the rule the
  whole interface follows.
-->
