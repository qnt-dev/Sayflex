  <g fill="#f5f5f2">
    <rect x="55" y="99" width="18" height="58" rx="9" />
    <rect x="87" y="76" width="18" height="104" rx="9" />
    <rect x="119" y="58" width="18" height="140" rx="9" />
    <rect x="151" y="76" width="18" height="104" rx="9" />
    <rect x="183" y="99" width="18" height="58" rx="9" />
  </g>
  <rect x="186" y="186" width="26" height="26" fill="#b8501c" />
</svg>
