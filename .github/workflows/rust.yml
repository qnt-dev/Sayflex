name: Rust quality

on:
  push:
    # Every branch, not only release tags: the audit of 2026-10-21 found an
    # installed build that no CI run had checked.
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "rust-app/**"
      # The companion renderer builds against crates in the pet workspace, so a
      # change there can break this one.
      - "desktop-pet/**"
      - "rust-toolchain.toml"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust-app/**"
      # The companion renderer builds against crates in the pet workspace, so a
      # change there can break this one.
      - "desktop-pet/**"
      - "rust-toolchain.toml"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust-app
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-app
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  supply-chain:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust-app
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-app
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Advisories, licenses, bans, and sources
        run: cargo deny check

  pet-quality:
    name: desktop-pet quality
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-pet
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-pet
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  package:
    name: exact Windows release artifact
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, windows, x64, sayflex-release]
    needs: [quality, supply-chain, pet-quality]
    defaults:
      run:
        shell: powershell
        working-directory: rust-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-app
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Generate dependency notices
        run: ./scripts/generate-third-party-notices.ps1
      - name: Import public signing certificate
        id: certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SAYFLEX_SIGNING_PFX_BASE64: ${{ secrets.SAYFLEX_SIGNING_PFX_BASE64 }}
          SAYFLEX_SIGNING_PASSWORD: ${{ secrets.SAYFLEX_SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SAYFLEX_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SAYFLEX_SIGNING_PASSWORD)) {
            throw 'Public tag builds require the signing PFX and password secrets.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'sayflex-signing.pfx'
          [System.IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:SAYFLEX_SIGNING_PFX_BASE64)
          )
          $password = ConvertTo-SecureString $env:SAYFLEX_SIGNING_PASSWORD -AsPlainText -Force
          try {
            $certificate = Import-PfxCertificate `
              -FilePath $pfx `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password |
              Where-Object HasPrivateKey |
              Select-Object -First 1
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
          if (-not $certificate) {
            throw 'The signing PFX did not import a certificate with a private key.'
          }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Build unsigned developer installer
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/build-installer.ps1
      - name: Build signed public installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match workspace version $version."
          }
          ./scripts/build-installer.ps1 `
            -SigningThumbprint '${{ steps.certificate.outputs.thumbprint }}' `
            -RequireSignature
      # A witnessed receipt cannot exist before the exact signed bytes exist.
      # Publish the immutable candidate first; the protected job below waits
      # while those same bytes are installed and witnessed, then verifies the
      # evidence against their hash. Rebuilding after witnessing would create
      # a different timestamped signature and invalidate the evidence.
      - name: Upload exact release candidate
        uses: actions/upload-artifact@v4
        with:
          name: SayFlex-${{ github.sha }}
          if-no-files-found: error
          path: |
            rust-app/dist/SayFlex-*-win-x64-setup.exe
            rust-app/dist/SayFlex-*-win-x64-setup.exe.sha256
            rust-app/dist/app/build-manifest.json
            rust-app/dist/app/speech-backends.json
            rust-app/dist/app/THIRD_PARTY_NOTICES.md
            rust-app/scripts/smoke-evidence.schema.json
      - name: Install developer candidate silently
        if: github.event_name == 'workflow_dispatch'
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $installer = Join-Path $PWD "dist\SayFlex-$version-win-x64-setup.exe"
          $process = Start-Process -FilePath $installer `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' `
            -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)." }
      - name: Record developer installed smoke receipt
        if: github.event_name == 'workflow_dispatch'
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $installer = Join-Path $PWD "dist\SayFlex-$version-win-x64-setup.exe"
          ./scripts/smoke-installed.ps1 `
            -InstallerPath $installer `
            -ReceiptPath (Join-Path $PWD 'dist\smoke-receipt.json')
      - name: Upload developer smoke receipt
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SayFlex-${{ github.sha }}-developer-smoke
          if-no-files-found: error
          path: rust-app/dist/smoke-receipt.json
      - name: Remove imported signing certificate
        if: always() && startsWith(github.ref, 'refs/tags/v')
        env:
          SAYFLEX_SIGNING_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          $thumbprint = "$env:SAYFLEX_SIGNING_THUMBPRINT".Trim()
          if ($thumbprint -match '^[0-9A-Fa-f]{40}$') {
            $certificatePath = "Cert:\CurrentUser\My\$thumbprint"
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -DeleteKey -Force
            }
          }

  verify-public:
    name: witness exact signed candidate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, windows, x64, sayflex-release]
    needs: package
    # Configure this environment with required reviewers. While the job waits,
    # download the candidate from the package job, test that exact installer,
    # and update SAYFLEX_SMOKE_EVIDENCE_BASE64 with evidence carrying its hash.
    environment: sayflex-public
    defaults:
      run:
        shell: powershell
        working-directory: rust-app
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable candidate
        uses: actions/download-artifact@v4
        with:
          name: SayFlex-${{ github.sha }}
          path: candidate
      - name: Resolve exact candidate paths
        run: |
          $candidate = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $installer = @(
            Get-ChildItem -LiteralPath $candidate -Recurse -File -Filter 'SayFlex-*-win-x64-setup.exe'
          )
          $manifest = @(
            Get-ChildItem -LiteralPath $candidate -Recurse -File -Filter 'build-manifest.json'
          )
          if ($installer.Count -ne 1 -or $manifest.Count -ne 1) {
            throw 'The candidate artifact must contain exactly one installer and one build manifest.'
          }
          "SAYFLEX_CANDIDATE_INSTALLER=$($installer[0].FullName)" >> $env:GITHUB_ENV
          "SAYFLEX_CANDIDATE_STAGED=$($manifest[0].Directory.FullName)" >> $env:GITHUB_ENV
      - name: Install exact signed candidate
        run: |
          $process = Start-Process -FilePath $env:SAYFLEX_CANDIDATE_INSTALLER `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' `
            -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)." }
      - name: Materialize evidence witnessed against this candidate
        env:
          SAYFLEX_SMOKE_EVIDENCE_BASE64: ${{ secrets.SAYFLEX_SMOKE_EVIDENCE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SAYFLEX_SMOKE_EVIDENCE_BASE64)) {
            throw 'The protected public gate requires witnessed smoke evidence.'
          }
          [System.IO.File]::WriteAllBytes(
            (Join-Path $env:RUNNER_TEMP 'sayflex-smoke-evidence.json'),
            [Convert]::FromBase64String($env:SAYFLEX_SMOKE_EVIDENCE_BASE64)
          )
      - name: Verify installed bytes and witnessed behavior
        run: |
          ./scripts/smoke-installed.ps1 `
            -StagedDirectory $env:SAYFLEX_CANDIDATE_STAGED `
            -InstallerPath $env:SAYFLEX_CANDIDATE_INSTALLER `
            -EvidencePath (Join-Path $env:RUNNER_TEMP 'sayflex-smoke-evidence.json') `
            -ReceiptPath (Join-Path $PWD 'public-smoke-receipt.json') `
            -RequireComplete `
            -RequireSignature
      - name: Upload verified public receipt
        uses: actions/upload-artifact@v4
        with:
          name: SayFlex-${{ github.sha }}-verified-receipt
          if-no-files-found: error
          path: rust-app/public-smoke-receipt.json
