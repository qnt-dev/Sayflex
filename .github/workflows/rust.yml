name: Rust quality

on:
  push:
    paths:
      - "rust-app/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust-app/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust-app
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-app
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  supply-chain:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust-app
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-app
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Advisories, licenses, bans, and sources
        run: cargo deny check
